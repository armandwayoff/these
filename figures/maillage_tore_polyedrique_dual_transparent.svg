<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="340.157pt"
    height="226.772pt"
    viewBox="0 0 340.157 226.772">
  <defs>
    <!--
      Le SVG dual source ne contient que du blanc et myred=(190,30,45).
      Le filtre est appliqué au groupe déjà composé : les faces blanches ont
      donc d'abord occulté les arêtes arrière. Il convertit ensuite le blanc
      final en alpha nul, tout en conservant myred et son anticrénelage.
    -->
    <filter
        id="white-to-transparent"
        x="0"
        y="0"
        width="100%"
        height="100%"
        color-interpolation-filters="sRGB">
      <feColorMatrix
          type="matrix"
          values="
            0  0          0  0  0.745098
            0  0          0  0  0.117647
            0  0          0  0  0.176471
            0 -1.13333333 0  1.13333333  0"/>
    </filter>
  </defs>

  <g filter="url(#white-to-transparent)">
    <image
        x="0"
        y="0"
        width="340.157"
        height="226.772"
        preserveAspectRatio="none"
        xlink:href="maillage_tore_polyedrique_dual.svg"/>
  </g>
</svg>
